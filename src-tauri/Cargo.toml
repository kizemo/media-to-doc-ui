[package]
name = "media-to-doc-ui"
version = "1.4.1"
description = "Desktop UI for media-to-doc — turn local videos into AI-illustrated Markdown + HTML lectures"
authors = ["Duanyi"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "media_to_doc_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "fs", "macros", "time"] }
once_cell = "1"

# W14-B+ 实装:
# - tokio process:run_pipeline / cancel_run 子进程管理
# - once_cell:RunRegistry 共享 State(W14-B+ 备用,T3 暂用 Mutex)

[profile.release]
# panic = "abort" # Strip debug info for smaller binaries
codegen-units = 1
lto = true
opt-level = "s"
strip = true

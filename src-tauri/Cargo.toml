[package]
name = "media-to-doc-ui"
version = "1.5.0"
description = "Desktop UI for media-to-doc — turn local videos into AI-illustrated Markdown + HTML lectures"
authors = ["Duanyi"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "media_to_doc_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "fs", "macros", "time"] }
once_cell = "1"
keyring = { version = "4", features = ["v1"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
tauri-plugin-dialog = "2"

# W14-B+ 实装:
# - tokio process:run_pipeline / cancel_run 子进程管理
# - once_cell:RunRegistry 共享 State(W14-B+ 备用,T3 暂用 Mutex)
# W15-A T7.2 实装:
# - sha2:project_registry 的 canonical_id(sha256[:16])
# - tauri-plugin-dialog:New Run「选目录」按钮用 open({directory:true})

[profile.release]
# panic = "abort" # Strip debug info for smaller binaries
codegen-units = 1
lto = true
opt-level = "s"
strip = true
